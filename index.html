<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Maker</title>
<style>
  :root {
    --bg: #F5F6F7;
    --panel: #FFFFFF;
    --border: #DADDE1;
    --border-strong: #B9BEC5;
    --text-primary: #1B1F23;
    --text-secondary: #5B626B;
    --text-muted: #8A909A;
    --accent: #1D5FA6;
    --accent-hover: #164A82;
    --accent-tint: #E8F0FA;
    --success: #1E7A4C;
    --success-tint: #E7F5EC;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181B;
      --panel: #1F2226;
      --border: #33373D;
      --border-strong: #454A52;
      --text-primary: #EDEEF0;
      --text-secondary: #A7ACB3;
      --text-muted: #767C85;
      --accent: #5B9BE0;
      --accent-hover: #79AEEA;
      --accent-tint: #1C2B3D;
      --success: #4FBE84;
      --success-tint: #17281E;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    padding: 32px 20px 80px;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }

  .agent-name-field {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar-wrap {
    position: relative;
    width: 36px;
    height: 36px;
    flex: none;
  }

  .avatar-circle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: var(--accent-tint);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    user-select: none;
  }

  .avatar-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .avatar-remove {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    color: var(--text-secondary);
    font-size: 10px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }

  .avatar-wrap.has-photo .avatar-remove {
    display: flex;
  }

  .agent-name-field label {
    margin: 0;
    font-size: 12.5px;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .agent-name-field input {
    width: 160px;
    padding: 6px 9px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--text-primary);
    font-family: var(--sans);
    font-size: 13px;
  }

  .agent-name-field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-tint);
  }

  h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  header p {
    color: var(--text-secondary);
    margin: 0;
    font-size: 13.5px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  .panel h2 {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    margin: 0 0 16px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 20px 0 10px;
  }

  .section-label:first-of-type {
    margin-top: 0;
  }

  .field {
    margin-bottom: 14px;
  }

  .field:last-child {
    margin-bottom: 0;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 5px;
    color: var(--text-primary);
  }

  label .req {
    color: var(--text-muted);
    font-weight: 400;
  }

  input[type="text"], textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--text-primary);
    font-family: var(--sans);
    font-size: 14px;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-tint);
  }

  input.invalid {
    border-color: #C4432B;
  }

  textarea {
    resize: vertical;
    min-height: 80px;
  }

  .error-msg {
    font-size: 12px;
    color: #C4432B;
    margin-top: 4px;
    display: none;
  }

  .error-msg.show {
    display: block;
  }

  .row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  button {
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 500;
    border-radius: var(--radius);
    padding: 9px 16px;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: var(--panel);
    color: var(--text-primary);
    transition: background 0.15s, border-color 0.15s;
  }

  button:hover {
    background: var(--bg);
  }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    flex: 1;
  }

  button.primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  button.primary.copied {
    background: var(--success);
    border-color: var(--success);
  }

  button:active {
    transform: scale(0.99);
  }

  .preview {
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    min-height: 320px;
    color: var(--text-primary);
  }

  .preview .placeholder {
    color: var(--text-muted);
    font-family: var(--sans);
    font-style: normal;
  }

  .status {
    font-size: 12.5px;
    color: var(--success);
    margin-top: 8px;
    height: 16px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .status.show {
    opacity: 1;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 10px 4px;
    margin-right: 20px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
  }

  .tab-btn:hover {
    background: none;
    color: var(--text-primary);
  }

  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .view {
    display: none;
  }

  .view.active {
    display: block;
  }

  .spiel-cats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .spiel-cat-btn {
    border-radius: 999px;
    padding: 8px 16px;
  }

  .spiel-cat-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .spiel-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .spiel-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .spiel-text {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-primary);
    margin-bottom: 10px;
    white-space: pre-wrap;
  }

  .spiel-item button {
    font-size: 12.5px;
    padding: 6px 12px;
  }

  .spiel-item .btn-row {
    display: flex;
    gap: 8px;
  }

  .spiel-item button.copied {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }

  .spiel-item button.saved {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }

  .spiel-edit-area {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--text-primary);
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.6;
    resize: vertical;
    min-height: 70px;
    margin-bottom: 10px;
  }

  .spiel-edit-area:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-tint);
  }

  .spiel-list-header {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }

  .spiel-item button.danger:hover {
    background: #C4432B;
    border-color: #C4432B;
    color: #fff;
  }

  .chat-wrap {
    display: flex;
    flex-direction: column;
    height: 560px;
    max-height: 70vh;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    overflow: hidden;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chat-msg {
    display: flex;
    gap: 10px;
    max-width: 80%;
  }

  .chat-msg.me {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .chat-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex: none;
    object-fit: cover;
    background: var(--accent-tint);
  }

  .chat-bubble-col {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .chat-msg.me .chat-bubble-col {
    align-items: flex-end;
  }

  .chat-name {
    font-size: 11.5px;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .chat-bubble {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .chat-msg.me .chat-bubble {
    background: var(--accent-tint);
    border-color: var(--accent-tint);
  }

  .chat-time {
    font-size: 10.5px;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .chat-compose {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .chat-compose input[type="text"] {
    flex: 1;
  }

  .chat-you-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--text-secondary);
  }

  .chat-you-bar img {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    object-fit: cover;
  }

  .chat-you-bar strong {
    color: var(--text-primary);
    font-weight: 600;
  }

  .chat-empty, .chat-status {
    color: var(--text-muted);
    font-size: 13.5px;
    padding: 16px;
    text-align: center;
  }

  .spiel-empty {
    color: var(--text-muted);
    font-size: 13.5px;
    padding: 8px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="pageTitle">Notes Maker</h1>
      <p id="pageSubtitle">Fill in the fields, then copy a ServiceNow-ready ticket description to your clipboard.</p>
    </div>
    <div class="agent-name-field">
      <div class="avatar-wrap" id="avatarWrap" title="Click to add a photo">
        <div class="avatar-circle" id="avatarCircle">+</div>
        <button type="button" class="avatar-remove" id="avatarRemove" title="Remove photo">&times;</button>
        <input type="file" id="avatarInput" accept="image/*" style="display:none">
      </div>
      <div>
        <label for="agentNameInput">Your name</label>
        <input type="text" id="agentNameInput">
      </div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabNotes" type="button">Notes Maker</button>
    <button class="tab-btn" id="tabSpiel" type="button">Call Spiel</button>
    <button class="tab-btn" id="tabEmail" type="button">Email Template</button>
    <button class="tab-btn" id="tabChat" type="button">Team Chat</button>
  </div>

  <div class="view active" id="viewNotes">
  <div class="grid">
    <div class="panel">
      <h2>Ticket details</h2>
      <form id="record-form">

        <div class="section-label">User info</div>
        <div class="field">
          <label for="verification">Verification</label>
          <input type="text" id="verification" value="Verified user via DUO &quot;&quot;">
        </div>
        <div class="field">
          <label for="clientName">Client name</label>
          <input type="text" id="clientName">
        </div>
        <div class="field">
          <label for="loginId">Login ID <span class="req">required</span></label>
          <input type="text" id="loginId">
          <div class="error-msg" id="err-loginId">Enter a login ID.</div>
        </div>
        <div class="field">
          <label for="currentLocation">Current location</label>
          <input type="text" id="currentLocation">
        </div>
        <div class="field">
          <label for="phoneNumber">Phone number</label>
          <input type="text" id="phoneNumber">
        </div>
        <div class="field">
          <label for="altNumber">Alt number</label>
          <input type="text" id="altNumber">
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input type="text" id="email">
        </div>

        <div class="section-label">Device</div>
        <div class="field">
          <label for="deviceName">Device name</label>
          <input type="text" id="deviceName">
        </div>
        <div class="field">
          <label for="osVersion">Operating system and version</label>
          <input type="text" id="osVersion">
        </div>
        <div class="field">
          <label for="drivePath">Drive path/folder name</label>
          <input type="text" id="drivePath">
        </div>
        <div class="field">
          <label for="printerName">Printer name</label>
          <input type="text" id="printerName">
        </div>

        <div class="section-label">Issue</div>
        <div class="field">
          <label for="description">Comprehensive description of the issue</label>
          <input type="text" id="description">
        </div>
        <div class="field">
          <label for="troubleshooting">Troubleshooting steps/additional information</label>
          <textarea id="troubleshooting"></textarea>
        </div>
      </form>
      <div class="row">
        <button class="primary" id="copyBtn" type="button">Copy to clipboard</button>
        <button id="clearBtn" type="button">Clear</button>
      </div>
      <div class="status" id="status">Copied — paste into ServiceNow</div>
    </div>

    <div class="panel">
      <h2>Preview</h2>
      <div class="preview" id="preview"></div>
    </div>
  </div>
  </div>

  <div class="view" id="viewSpiel">
    <div class="spiel-cats" id="spielCats"></div>
    <div class="spiel-list-header">
      <button type="button" id="addSpielBtn">+ Add new spiel</button>
    </div>
    <div class="spiel-list" id="spielList"></div>
  </div>

  <div class="view" id="viewEmail">
    <div class="spiel-cats" id="emailCats"></div>
    <div class="spiel-list-header">
      <button type="button" id="addEmailBtn">+ Add new template</button>
    </div>
    <div class="spiel-list" id="emailList"></div>
  </div>

  <div class="view" id="viewChat">
    <div class="chat-wrap">
      <div class="chat-you-bar" id="chatYouBar" style="display:none;">
        <img id="chatYouAvatar" src="" alt="">
        <span>Chatting as <strong id="chatYouName"></strong></span>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-status" id="chatStatus">Connecting…</div>
      </div>
      <div class="chat-compose">
        <input type="text" id="chatInput" placeholder="Message your team...">
        <button class="primary" id="chatSendBtn" type="button">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
  const fields = [
    'verification', 'clientName', 'loginId', 'currentLocation', 'phoneNumber', 'altNumber', 'email',
    'deviceName', 'osVersion', 'drivePath', 'printerName',
    'description', 'troubleshooting'
  ];
  const inputs = {};
  fields.forEach(id => inputs[id] = document.getElementById(id));

  const preview = document.getElementById('preview');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusEl = document.getElementById('status');
  const errLoginId = document.getElementById('err-loginId');

  const STORAGE_KEY = 'record-formatter-draft-v3';
  const SEP = '**********************************************';

  function buildPlainText(v) {
    const lines = [];
    lines.push('Verification: ' + v.verification);
    lines.push('');
    lines.push('Client Name: ' + v.clientName);
    lines.push('Login ID: ' + v.loginId);
    lines.push('Current Location: ' + v.currentLocation);
    lines.push('Phone Number: ' + v.phoneNumber);
    lines.push('Alt Number: ' + v.altNumber);
    lines.push('Email address: ' + v.email);
    lines.push('');
    lines.push(SEP);
    lines.push('');
    lines.push('Device Name: ' + v.deviceName);
    lines.push('Operating System and Version: ' + v.osVersion);
    lines.push('Drive Path/Folder Name: ' + v.drivePath);
    lines.push('Printer Name: ' + v.printerName);
    lines.push('');
    lines.push(SEP);
    lines.push('');
    lines.push('Comprehensive Description of the Issue:');
    lines.push(v.description);
    lines.push('');
    lines.push('');
    lines.push('Troubleshooting steps/Additional Information:');
    lines.push(v.troubleshooting);
    return lines.join('\n');
  }

  function esc(s) {
    return (s || '').replace(/</g, '&lt;');
  }

  function buildHtml(v) {
    const p = [];
    p.push('<p>Verification: ' + esc(v.verification) + '</p>');
    p.push('<p>Client Name: ' + esc(v.clientName) + '</p>');
    p.push('<p>Login ID: ' + esc(v.loginId) + '</p>');
    p.push('<p>Current Location: ' + esc(v.currentLocation) + '</p>');
    p.push('<p>Phone Number: ' + esc(v.phoneNumber) + '</p>');
    p.push('<p>Alt Number: ' + esc(v.altNumber) + '</p>');
    p.push('<p>Email address: ' + esc(v.email) + '</p>');
    p.push('<p>' + SEP + '</p>');
    p.push('<p>Device Name: ' + esc(v.deviceName) + '</p>');
    p.push('<p>Operating System and Version: ' + esc(v.osVersion) + '</p>');
    p.push('<p>Drive Path/Folder Name: ' + esc(v.drivePath) + '</p>');
    p.push('<p>Printer Name: ' + esc(v.printerName) + '</p>');
    p.push('<p>' + SEP + '</p>');
    p.push('<p><strong>Comprehensive Description of the Issue:</strong><br>' + esc(v.description) + '</p>');
    p.push('<p>&nbsp;</p>');
    p.push('<p><strong>Troubleshooting steps/Additional Information:</strong><br>' + esc(v.troubleshooting) + '</p>');
    return p.join('');
  }

  function currentValues() {
    const v = {};
    fields.forEach(id => v[id] = inputs[id].value.trim());
    return v;
  }

  function renderPreview() {
    const v = currentValues();
    const hasAny = fields.some(id => v[id]);
    if (!hasAny) {
      preview.innerHTML = '<span class="placeholder">Start filling in the form to see the formatted output here.</span>';
      return;
    }
    preview.textContent = buildPlainText(v);
  }

  function saveDraft() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentValues()));
    } catch (e) {}
  }

  function loadDraft() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const v = JSON.parse(raw);
      fields.forEach(id => {
        if (v[id]) inputs[id].value = v[id];
      });
    } catch (e) {}
  }

  fields.forEach(id => {
    inputs[id].addEventListener('input', () => {
      renderPreview();
      saveDraft();
      if (id === 'loginId' && inputs.loginId.value.trim()) {
        inputs.loginId.classList.remove('invalid');
        errLoginId.classList.remove('show');
      }
    });
  });

  async function copyToClipboard() {
    const v = currentValues();
    if (!v.loginId) {
      inputs.loginId.classList.add('invalid');
      errLoginId.classList.add('show');
      inputs.loginId.focus();
      return;
    }

    const plain = buildPlainText(v);
    const html = buildHtml(v);

    try {
      if (window.ClipboardItem) {
        await navigator.clipboard.write([
          new ClipboardItem({
            'text/plain': new Blob([plain], { type: 'text/plain' }),
            'text/html': new Blob([html], { type: 'text/html' })
          })
        ]);
      } else {
        await navigator.clipboard.writeText(plain);
      }
      copyBtn.textContent = 'Copied';
      copyBtn.classList.add('copied');
      statusEl.classList.add('show');
      setTimeout(() => {
        copyBtn.textContent = 'Copy to clipboard';
        copyBtn.classList.remove('copied');
        statusEl.classList.remove('show');
      }, 1800);
    } catch (e) {
      try {
        await navigator.clipboard.writeText(plain);
        copyBtn.textContent = 'Copied';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy to clipboard';
          copyBtn.classList.remove('copied');
        }, 1800);
      } catch (e2) {
        alert('Could not access the clipboard. Select the preview text and copy it manually.');
      }
    }
  }

  copyBtn.addEventListener('click', copyToClipboard);

  clearBtn.addEventListener('click', () => {

  // ---- Agent avatar ----
  const AVATAR_KEY = 'agent-avatar';
  const avatarWrap = document.getElementById('avatarWrap');
  const avatarCircle = document.getElementById('avatarCircle');
  const avatarInput = document.getElementById('avatarInput');
  const avatarRemove = document.getElementById('avatarRemove');

  function renderAvatar(dataUrl) {
    if (dataUrl) {
      avatarCircle.innerHTML = '';
      const img = document.createElement('img');
      img.src = dataUrl;
      avatarCircle.appendChild(img);
      avatarWrap.classList.add('has-photo');
    } else {
      avatarCircle.innerHTML = '+';
      avatarWrap.classList.remove('has-photo');
    }
  }

  function loadAvatar() {
    try {
      return localStorage.getItem(AVATAR_KEY) || '';
    } catch (e) {
      return '';
    }
  }

  function saveAvatar(dataUrl) {
    try {
      if (dataUrl) {
        localStorage.setItem(AVATAR_KEY, dataUrl);
      } else {
        localStorage.removeItem(AVATAR_KEY);
      }
    } catch (e) {}
  }

  avatarCircle.addEventListener('click', () => avatarInput.click());

  avatarInput.addEventListener('change', () => {
    const file = avatarInput.files && avatarInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const size = 128;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        saveAvatar(dataUrl);
        renderAvatar(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    avatarInput.value = '';
  });

  avatarRemove.addEventListener('click', (e) => {
    e.stopPropagation();
    saveAvatar('');
    renderAvatar('');

  // ---- Reusable category/list module (used by Call Spiel and Email Template) ----
  function createListTab(opts) {
    const catsEl = document.getElementById(opts.catsId);
    const listEl = document.getElementById(opts.listId);
    const addBtnEl = document.getElementById(opts.addBtnId);
    const data = opts.defaultData();
    let activeCat = null;
    let rendered = false;
    let editingIndex = null;
    let editingIsNew = false;

    function loadOverrides() {
      try {
        const raw = localStorage.getItem(opts.storageKey);
        if (!raw) return;
        const saved = JSON.parse(raw);
        Object.keys(data).forEach(cat => {
          if (Array.isArray(saved[cat])) data[cat] = saved[cat];
        });
      } catch (e) {}
    }

    function saveOverrides() {
      try {
        localStorage.setItem(opts.storageKey, JSON.stringify(data));
      } catch (e) {}
    }

    function renderCats() {
      catsEl.innerHTML = '';
      Object.keys(data).forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'spiel-cat-btn';
        btn.textContent = cat;
        btn.addEventListener('click', () => selectCat(cat));
        catsEl.appendChild(btn);
      });
      rendered = true;
      selectCat(Object.keys(data)[0]);
    }

    function selectCat(cat) {
      activeCat = cat;
      editingIndex = null;
      editingIsNew = false;
      [...catsEl.children].forEach(btn => {
        btn.classList.toggle('active', btn.textContent === cat);
      });
      renderList(cat);
    }

    addBtnEl.addEventListener('click', () => {
      if (!activeCat) return;
      data[activeCat].push('');
      editingIndex = data[activeCat].length - 1;
      editingIsNew = true;
      renderList(activeCat);
    });

    function renderList(cat) {
      listEl.innerHTML = '';
      const items = data[cat] || [];
      if (!items.length) {
        listEl.innerHTML = '<div class="spiel-empty">' + opts.emptyLabel + '</div>';
        return;
      }
      items.forEach((text, i) => {
        const item = document.createElement('div');
        item.className = 'spiel-item';

        if (editingIndex === i) {
          const textarea = document.createElement('textarea');
          textarea.className = 'spiel-edit-area';
          textarea.value = text;

          const btnRow = document.createElement('div');
          btnRow.className = 'btn-row';

          const saveBtn = document.createElement('button');
          saveBtn.type = 'button';
          saveBtn.textContent = 'Save';
          saveBtn.addEventListener('click', () => {
            const newText = textarea.value.trim();
            if (newText) {
              data[cat][i] = newText;
              saveOverrides();
            } else if (editingIsNew) {
              data[cat].splice(i, 1);
              saveOverrides();
            }
            editingIndex = null;
            editingIsNew = false;
            renderList(cat);
          });

          const cancelBtn = document.createElement('button');
          cancelBtn.type = 'button';
          cancelBtn.textContent = 'Cancel';
          cancelBtn.addEventListener('click', () => {
            if (editingIsNew) {
              data[cat].splice(i, 1);
            }
            editingIndex = null;
            editingIsNew = false;
            renderList(cat);
          });

          btnRow.appendChild(saveBtn);
          btnRow.appendChild(cancelBtn);
          item.appendChild(textarea);
          item.appendChild(btnRow);
          listEl.appendChild(item);
          textarea.focus();
          return;
        }

        const textEl = document.createElement('div');
        textEl.className = 'spiel-text';
        textEl.textContent = applyAgentName(text);

        const btnRow = document.createElement('div');
        btnRow.className = 'btn-row';

        const editBtnEl = document.createElement('button');
        editBtnEl.type = 'button';
        editBtnEl.textContent = 'Edit';
        editBtnEl.addEventListener('click', () => {
          editingIndex = i;
          editingIsNew = false;
          renderList(cat);
        });

        const deleteBtnEl = document.createElement('button');
        deleteBtnEl.type = 'button';
        deleteBtnEl.className = 'danger';
        deleteBtnEl.textContent = 'Delete';
        deleteBtnEl.addEventListener('click', () => {
          data[cat].splice(i, 1);
          saveOverrides();
          renderList(cat);
        });

        btnRow.appendChild(editBtnEl);
        btnRow.appendChild(deleteBtnEl);
        item.appendChild(textEl);
        item.appendChild(btnRow);
        listEl.appendChild(item);
      });
    }

    loadOverrides();

    return {
      renderIfNeeded: () => { if (!rendered) renderCats(); },
      refresh: () => { if (activeCat) renderList(activeCat); }
    };
  }

  // ---- Team Chat ----
  const chatMessagesEl = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const chatSendBtn = document.getElementById('chatSendBtn');

  let chatDb = null;
  let chatUser = null;
  let chatMyId = null;
  let chatMyProfile = null;
  let chatInitStarted = false;
  let chatUnsub = null;
  let chatCurrentMessages = [];

  const CHAT_MAX_MESSAGES = 200;

  function chatSetStatus(msg) {
    chatMessagesEl.innerHTML = '<div class="chat-status">' + msg + '</div>';
  }

  async function initChat() {
    if (chatInitStarted) return;
    chatInitStarted = true;

    chatDb = await claude.use('db');
    if (!chatDb) {
      chatSetStatus('Team chat isn\u2019t available in this view.');
      return;
    }
    chatUser = await claude.use('user');
    chatMyId = chatUser ? await chatUser.id() : null;

    if (chatUser) {
      try {
        const me = await chatUser.me();
        chatMyProfile = me;
        const youBar = document.getElementById('chatYouBar');
        document.getElementById('chatYouName').textContent = me.name || 'you';
        document.getElementById('chatYouAvatar').src = me.avatarUrl;
        youBar.style.display = 'flex';
      } catch (e) {}
    }

    const chatDocRef = chatDb.doc('chat/messages');
    chatUnsub = chatDocRef.onSnapshot(
      async (snap) => {
        const data = snap.exists ? snap.data() : null;
        chatCurrentMessages = (data && Array.isArray(data.messages)) ? data.messages : [];
        await renderChat();
      },
      (err) => {
        chatSetStatus('Chat is temporarily unavailable.');
      }
    );
  }

  async function renderChat() {
    if (!chatCurrentMessages.length) {
      chatSetStatus('No messages yet — say hello.');
      return;
    }

    let profiles = {};
    if (chatUser) {
      const ids = [...new Set(chatCurrentMessages.map(m => m.authorId).filter(Boolean))];
      try {
        profiles = await chatUser.profiles(ids);
      } catch (e) {}
    }
    if (chatMyId && chatMyProfile) {
      profiles[chatMyId] = {
        id: chatMyId,
        name: chatMyProfile.name,
        avatarUrl: chatMyProfile.avatarUrl,
        color: chatMyProfile.color,
        email: chatMyProfile.email,
        isMe: true
      };
    }

    const wasNearBottom = (chatMessagesEl.scrollHeight - chatMessagesEl.scrollTop - chatMessagesEl.clientHeight) < 80;

    chatMessagesEl.innerHTML = '';
    chatCurrentMessages.forEach(m => {
      const isMe = chatMyId && m.authorId === chatMyId;
      const profile = m.authorId ? profiles[m.authorId] : null;
      const name = (profile && profile.name) || 'Someone';
      const avatarUrl = (profile && profile.avatarUrl) || '';

      const row = document.createElement('div');
      row.className = 'chat-msg' + (isMe ? ' me' : '');

      if (avatarUrl) {
        const img = document.createElement('img');
        img.className = 'chat-avatar';
        img.src = avatarUrl;
        row.appendChild(img);
      } else {
        const filler = document.createElement('div');
        filler.className = 'chat-avatar';
        row.appendChild(filler);
      }

      const col = document.createElement('div');
      col.className = 'chat-bubble-col';

      if (!isMe) {
        const nameEl = document.createElement('div');
        nameEl.className = 'chat-name';
        nameEl.textContent = name;
        col.appendChild(nameEl);
      } else {
        const nameEl = document.createElement('div');
        nameEl.className = 'chat-name';
        nameEl.textContent = name || 'You';
        col.appendChild(nameEl);
      }

      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      bubble.textContent = m.text;
      col.appendChild(bubble);

      const timeEl = document.createElement('div');
      timeEl.className = 'chat-time';
      try {
        timeEl.textContent = new Date(m.ts).toLocaleString([], { hour: '2-digit', minute: '2-digit' });
      } catch (e) {}
      col.appendChild(timeEl);

      row.appendChild(col);
      chatMessagesEl.appendChild(row);
    });

    if (wasNearBottom) {
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }
  }

  async function sendChatMessage() {
    const text = chatInput.value.trim();
    if (!text || !chatDb) return;

    chatInput.value = '';
    chatInput.disabled = true;

    const newMessage = { authorId: chatMyId, text: text, ts: Date.now() };
    let next = chatCurrentMessages.concat([newMessage]);
    if (next.length > CHAT_MAX_MESSAGES) {
      next = next.slice(next.length - CHAT_MAX_MESSAGES);
    }

    try {
      await chatDb.doc('chat/messages').set({ messages: next });
    } catch (e) {
      // last-writer-wins; a rejected write just won't show up
    }

    chatInput.disabled = false;
    chatInput.focus();
  }

  chatSendBtn.addEventListener('click', sendChatMessage);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendChatMessage();
    }
  });
